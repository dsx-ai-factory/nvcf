# Bootstrap runs before readiness. Hooks wait before JWT setup or migrations.

# The script runs in an image that must contain:
# - bash
# - kubectl
# - jq
# - jwker
# - sha256sum or shasum
{{- $serverFullname := include "nvcf-openbao.serverFullname" . }}
{{- $bootstrapJobName := include "nvcf-openbao.bootstrapJobName" . }}
{{- $root := . }}
{{- if ne .Values.openbao.server.podManagementPolicy "Parallel" }}
{{- fail "OpenBao bootstrap requires openbao.server.podManagementPolicy=Parallel" }}
{{- end }}
{{- range $phase := list "bootstrap" "initialize" "wait" }}
{{- $bootstrapOnly := eq $phase "bootstrap" }}
{{- $waitOnly := eq $phase "wait" }}
{{- with $root }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ if $bootstrapOnly }}{{ $bootstrapJobName }}{{ else if $waitOnly }}{{ $serverFullname }}-wait-bootstrap{{ else }}{{ $serverFullname }}-initialize-cluster{{ end }}
  namespace: {{ include "nvcf-openbao.namespace" . }}
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: {{ if $bootstrapOnly }}openbao-bootstrap{{ else }}openbao-initialize{{ end }}
  {{- if not $bootstrapOnly }}
  annotations:
    helm.sh/hook: {{ if $waitOnly }}post-upgrade{{ else }}post-install{{ end }}
    helm.sh/hook-weight: "-5"
  {{- end }}
spec:
  {{- if $bootstrapOnly }}
  activeDeadlineSeconds: {{ include "nvcf-openbao.bootstrapDeadlineSeconds" . }}
  {{- end }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: {{ if $bootstrapOnly }}openbao-bootstrap{{ else }}openbao-initialize{{ end }}
      {{- with .Values.openbao.hooks.initializeCluster.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
      {{- with .Values.openbao.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $phase "initialize" }}
      {{- with .Values.openbao.hooks.initializeCluster.schedulingGates }}
      schedulingGates:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: bao-init
          image: "{{ include "openbao.image" (dict "image" .Values.openbao.migrations.image "name" "openbao.migrations.image") }}"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: ["/bin/bash"]
          args:
            - -c
            - /scripts/deploy.sh {{ include "nvcf-openbao.namespace" . }} {{ $serverFullname }} helm
          env:
            {{- include "nvcf-openbao.kubectlEnv" . | nindent 12 }}
            - name: OPENBAO_BOOTSTRAP_ONLY
              value: {{ $bootstrapOnly | quote }}
            - name: OPENBAO_BOOTSTRAP_JOB_NAME
              value: {{ $bootstrapJobName | quote }}
            - name: OPENBAO_BOOTSTRAP_TIMEOUT_SECONDS
              value: {{ add (include "nvcf-openbao.bootstrapDeadlineSeconds" . | int) 60 | quote }}
            - name: OPENBAO_WAIT_ONLY
              value: {{ $waitOnly | quote }}
            - name: OPENBAO_API_TIMEOUT_SECONDS
              value: {{ include "nvcf-openbao.apiTimeoutSeconds" . | quote }}
            - name: OPENBAO_CREDENTIAL_TIMEOUT_SECONDS
              value: {{ include "nvcf-openbao.credentialTimeoutSeconds" . | quote }}
            - name: JWT_PLUGIN_LIFECYCLE_MODE
              value: {{ include "nvcf-openbao.jwtLifecycleMode" . | quote }}
            - name: AUTO_UNSEAL
              value: {{ .Values.openbao.server.autoUnseal.enabled | quote }}
            {{- if .Values.openbao.server.autoUnseal.enabled }}
            - name: RECOVERY_SHARES
              value: {{ .Values.openbao.server.autoUnseal.recovery.shares | quote }}
            - name: RECOVERY_THRESHOLD
              value: {{ .Values.openbao.server.autoUnseal.recovery.threshold | quote }}
            {{- end }}
          volumeMounts:
            - name: init-script
              readOnly: true
              mountPath: "/scripts"
            - name: utils-script
              readOnly: true
              mountPath: "/scripts/utils"
          resources:
            {{- toYaml .Values.openbao.hooks.initializeCluster.resources | nindent 12 }}
      restartPolicy: Never
      serviceAccountName: {{ $serverFullname }}-initialize-cluster
      volumes:
        - name: init-script
          configMap:
            name: {{ $serverFullname }}-bootstrap-script
            # The migrations image runs as the upstream non-root OpenBao user.
            # These ConfigMaps contain executable scripts, not secrets.
            defaultMode: 0555
        - name: utils-script
          configMap:
            name: {{ $serverFullname }}-bootstrap-utils
            defaultMode: 0555
---
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $serverFullname }}-bootstrap-script
  namespace: {{ include "nvcf-openbao.namespace" . }}
data:
  deploy.sh: |-
    {{- .Files.Get "scripts/deploy.sh" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $serverFullname }}-bootstrap-utils
  namespace: {{ include "nvcf-openbao.namespace" . }}
data:
  utils.sh: |-
    {{- .Files.Get "scripts/utils.sh" | nindent 4 }}
  log.sh: |-
    {{- .Files.Get "scripts/log.sh" | nindent 4 }}
  jwt-plugin.sh: |-
    {{- .Files.Get "scripts/utils/jwt-plugin.sh" | nindent 4 }}
  bootstrap.sh: |-
    {{- .Files.Get "scripts/utils/bootstrap.sh" | nindent 4 }}
